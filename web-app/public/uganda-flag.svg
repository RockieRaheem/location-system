<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- Official Uganda Flag: 6 horizontal bands with Grey Crowned Crested Crane -->
  <!-- Based on National Flag and Armorial Ensigns Act (1962) -->
  
  <!-- Top Black Band -->
  <rect x="0" y="0" width="900" height="100" fill="#000000"/>
  
  <!-- Yellow Band -->
  <rect x="0" y="100" width="900" height="100" fill="#FCDC04"/>
  
  <!-- Red Band -->
  <rect x="0" y="200" width="900" height="100" fill="#D90000"/>
  
  <!-- Bottom Black Band -->
  <rect x="0" y="300" width="900" height="100" fill="#000000"/>
  
  <!-- Bottom Yellow Band -->
  <rect x="0" y="400" width="900" height="100" fill="#FCDC04"/>
  
  <!-- Bottom Red Band -->
  <rect x="0" y="500" width="900" height="100" fill="#D90000"/>
  
  <!-- White Disc at Center (background for crane) -->
  <circle cx="450" cy="300" r="140" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  
  <!-- Grey Crowned Crested Crane (Balearica regulorum gibbericeps) -->
  <!-- National bird of Uganda - symbol of good fortune, longevity, and wealth -->
  
  <!-- Crane body -->
  <ellipse cx="450" cy="310" rx="55" ry="70" fill="#6B7280"/>
  
  <!-- Crane neck -->
  <path d="M 450 240 Q 445 200 450 160" stroke="#6B7280" stroke-width="12" fill="none" stroke-linecap="round"/>
  
  <!-- Crane head -->
  <circle cx="450" cy="145" r="18" fill="#3F3F3F"/>
  
  <!-- Crane beak (yellowish) -->
  <path d="M 465 143 L 490 140 L 465 147 Z" fill="#D4A574"/>
  
  <!-- Crane eye -->
  <circle cx="456" cy="140" r="4" fill="#FFFFFF"/>
  <circle cx="457" cy="140" r="2" fill="#000000"/>
  
  <!-- Crane crown (distinctive feature - golden tuft of feathers) -->
  <g id="crown">
    <!-- Crown base -->
    <ellipse cx="450" cy="125" rx="8" ry="6" fill="#DAA520"/>
    <!-- Crown spikes -->
    <path d="M 445 122 Q 442 110 443 100" stroke="#DAA520" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 450 120 Q 450 105 451 95" stroke="#DAA520" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 455 122 Q 458 110 457 100" stroke="#DAA520" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Red facial patches (distinctive marking) -->
  <ellipse cx="447" cy="152" rx="6" ry="8" fill="#DC143C" opacity="0.7"/>
  <ellipse cx="453" cy="152" rx="6" ry="8" fill="#DC143C" opacity="0.7"/>
  
  <!-- Crane wings -->
  <ellipse cx="410" cy="310" rx="40" ry="50" fill="#5A5F68" opacity="0.8"/>
  <ellipse cx="490" cy="310" rx="40" ry="50" fill="#5A5F68" opacity="0.8"/>
  
  <!-- Wing details -->
  <path d="M 400 280 Q 390 300 395 330" stroke="#4A4F58" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M 500 280 Q 510 300 505 330" stroke="#4A4F58" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Crane legs (long and thin) -->
  <line x1="435" y1="375" x2="430" y2="420" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>
  <line x1="465" y1="375" x2="470" y2="420" stroke="#2D2D2D" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Crane feet -->
  <g id="left-foot">
    <line x1="430" y1="420" x2="415" y2="430" stroke="#2D2D2D" stroke-width="3"/>
    <line x1="430" y1="420" x2="435" y2="432" stroke="#2D2D2D" stroke-width="3"/>
    <line x1="430" y1="420" x2="445" y2="428" stroke="#2D2D2D" stroke-width="3"/>
  </g>
  <g id="right-foot">
    <line x1="470" y1="420" x2="485" y2="430" stroke="#2D2D2D" stroke-width="3"/>
    <line x1="470" y1="420" x2="465" y2="432" stroke="#2D2D2D" stroke-width="3"/>
    <line x1="470" y1="420" x2="455" y2="428" stroke="#2D2D2D" stroke-width="3"/>
  </g>
  
  <!-- Crane tail feathers (distinctive upright posture) -->
  <path d="M 420 350 Q 410 330 415 310" stroke="#5A5F68" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 430 360 Q 418 340 420 320" stroke="#5A5F68" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 480 360 Q 492 340 490 320" stroke="#5A5F68" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M 470 350 Q 480 330 475 310" stroke="#5A5F68" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
</svg>